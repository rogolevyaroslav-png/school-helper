name: Update Grades

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium pandas webdriver-manager

      - name: Run scraper
        env:
          DNEVNIK_LOGIN: ${{ secrets.DNEVNIK_LOGIN }}
          DNEVNIK_PASSWORD: ${{ secrets.DNEVNIK_PASSWORD }}
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f grades.csv ]; then
            git add grades.csv
            echo "✅ grades.csv найден"
          fi
          
          for f in debug_main.html debug_after_login.html debug_grades.html debug_error.html; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "💾 Найден $f"
            fi
          done
          
          git diff --staged --quiet || git commit -m "Обновление данных"
          git push || echo "Нечего пушить"
